baseURL = 'https://marcfranquesa.github.io/expledger/'
title = 'ExpLedger'
locale = 'en-us'

[module]
  [[module.imports]]
    path = 'github.com/alex-shpak/hugo-book'
  [[module.mounts]]
    source = '../docs'
    target = 'content/docs'
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'generated'
    target = 'content/docs'

[params]
  BookPortableLinks = 'error'

[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/marcfranquesa/expledger'

# Preserve literal flag names such as --based-on in generated help prose.
[markup.goldmark.extensions.typographer]
  disable = true
