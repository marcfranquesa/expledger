<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Project}} · ExpLedger</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242424; background: #fafaf9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 960px; margin: auto; padding: 48px 28px 72px; }
    .brand { margin: 0 0 44px; font-size: 14px; font-weight: 650; letter-spacing: -.02em; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 40px); font-weight: 600; letter-spacing: -.04em; }
    .context { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; color: #60605a; font-size: 14px; overflow-wrap: anywhere; }
    .branch { border: 1px solid #dcdcd6; border-radius: 5px; padding: 3px 7px; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
    .section-heading { margin: 36px 0 0; padding-bottom: 12px; border-bottom: 1px solid #dcdcd6; color: #60605a; font-size: 12px; font-weight: 500; }
    .experiments { list-style: none; margin: 0; padding: 0; }
    .experiment { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 24px 0; border-bottom: 1px solid #e4e4df; }
    .record { min-width: 0; }
    h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
    .id { display: block; margin-top: 4px; color: #60605a; overflow-wrap: anywhere; }
    time { display: block; margin-top: 10px; color: #60605a; font-size: 12px; font-variant-numeric: tabular-nums; }
    .github { flex-shrink: 0; display: inline-block; padding: 9px 12px; border: 1px solid #d4d4ce; border-radius: 6px; color: #33332e; background: #fff; font-size: 13px; text-decoration: none; }
    .github:hover { border-color: #8c8c83; background: #f3f3ef; }
    .github:focus-visible { outline: 2px solid #33332e; outline-offset: 4px; }
    .empty { padding: 44px 0; }
    .empty p { color: #60605a; line-height: 1.7; }
    @media (max-width: 600px) {
      main { padding: 28px 20px 48px; }
      .brand { margin-bottom: 32px; }
      .experiment { align-items: flex-start; flex-direction: column; gap: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">ExpLedger</p>
      <h1>Experiments</h1>
      <div class="context"><span>{{.Project}}</span><code class="branch">{{.Branch}}</code></div>
    </header>
    <p class="section-heading">Newest first</p>
    {{if .Experiments}}
    <ol class="experiments">
      {{range .Experiments}}
      <li class="experiment">
        <div class="record">
          <h2>{{.Title}}</h2>
          <code class="id">{{.ID}}</code>
          <time datetime="{{.DateTime}}">{{.CreatedAt}}</time>
        </div>
        <a class="github" href="{{.GitHubURL}}" aria-label="View {{.Title}} on GitHub">View on GitHub <span aria-hidden="true">↗</span></a>
      </li>
      {{end}}
    </ol>
    {{else}}
    <section class="empty">
      <h2>No experiments yet</h2>
      <p>Create your first record with <code>expledger new my-idea</code>.</p>
    </section>
    {{end}}
  </main>
</body>
</html>
